name: Auto-update Formula
on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  update-formula:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Tap
        uses: actions/checkout@v6

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          debug: false
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_FROM_API: ""
          HOMEBREW_NO_ENV_HINTS: "1"

      - name: Auto-merge existing PRs
        run: |
          for pr in $(gh pr list --state open --json number,headRefName --jq '.[] | select(.headRefName | startswith("bump-")) | .number'); do
            echo "Merging existing PR $pr..."
            gh pr merge --merge --delete-branch "$pr" || echo "Failed to merge PR $pr"
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Update Formulae
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config --global user.name "John Lafitte"
          git config --global user.email "jlafitte@users.noreply.github.com"

          brew tap "${{ github.repository }}"

          for formula in gemini-watermark-tool gwt-mini uad-ng; do
            echo "Checking $formula for updates..."
            latest_version=$(brew livecheck --formula --quiet --newer-only --json "${{ github.repository }}/$formula" | jq -r '.[0].version.latest // empty')
            if [ -n "$latest_version" ]; then
              echo "Found newer version $latest_version for $formula. Submitting PR..."
              brew bump-formula-pr \
                --no-audit \
                --no-browse \
                --no-fork \
                --force \
                --version="$latest_version" \
                "${{ github.repository }}/$formula" || echo "Failed to bump $formula"
            else
              echo "$formula is already up to date."
            fi
          done

      - name: Auto-merge new PRs
        if: always()
        run: |
          sleep 5
          for pr in $(gh pr list --state open --json number,headRefName --jq '.[] | select(.headRefName | startswith("bump-")) | .number'); do
            echo "Merging PR $pr..."
            gh pr merge --merge --delete-branch "$pr" || echo "Failed to merge PR $pr"
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
